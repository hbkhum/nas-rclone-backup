<h1>nas-rclone-backup</h1>
<p>A private, single-user tool. It runs rclone on the owner's home NAS and writes an encrypted nightly backup of the
owner's own files into the owner's own Google Drive.</p>
<p>It is not offered to the public and has no other users.</p>
